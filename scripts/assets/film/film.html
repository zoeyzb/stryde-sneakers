<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: #000; }
      canvas { display: block; }
    </style>
    <script type="importmap">
      { "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
    </script>
  </head>
  <body>
    <canvas id="out" width="1280" height="720"></canvas>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";

      const params = new URLSearchParams(location.search);
      const garment = params.get("garment") ?? "white";
      const W = 1280, H = 720;
      const looks = {
        white: { accent: 0xffffff, accentCss: "#f2f2f2", line: "COLLECTION 01  /  WHITE" },
        gray: { accent: 0xd8332b, accentCss: "#e04a3f", line: "COLLECTION 01  /  GRAPHITE" },
        sport: { accent: 0xff2a1f, accentCss: "#ff4a3d", line: "COLLECTION 01  /  OXBLOOD" },
      };
      const look = looks[garment];

      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(W, H);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x030303);
      const camera = new THREE.PerspectiveCamera(30, W / H, 0.01, 50);

      const draco = new DRACOLoader().setDecoderPath("/node_modules/three/examples/jsm/libs/draco/gltf/");
      const gltf = await new GLTFLoader().setDRACOLoader(draco).loadAsync("/public/models/ShirtScrolling.glb");
      const tex = await new THREE.TextureLoader().loadAsync(
        `/public/textures/${garment}/second/${garment === "white" ? "White_Studio" : garment === "gray" ? "Gray_Shirt" : "Sport_Shirt"}_Baked_Texture.webp`
      );
      tex.flipY = false;
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      const geometry = gltf.scene.getObjectByName("Shirt").geometry.clone();
      geometry.computeBoundingBox();
      const center = geometry.boundingBox.getCenter(new THREE.Vector3());
      geometry.translate(-center.x, -center.y, -center.z);
      const shirt = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ map: tex }));
      const pivot = new THREE.Group();
      pivot.add(shirt);
      scene.add(pivot);

      // Light frame: four emissive bars behind the garment.
      const frame = new THREE.Group();
      const barMat = new THREE.MeshBasicMaterial({ color: look.accent, transparent: true, opacity: 0 });
      const glowMat = new THREE.MeshBasicMaterial({ color: look.accent, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
      const bars = [
        [0, 0.38, 0.62, 0.008], [0, -0.38, 0.62, 0.008],
        [-0.31, 0, 0.008, 0.77], [0.31, 0, 0.008, 0.77],
      ];
      for (const [x, y, w, h] of bars) {
        const bar = new THREE.Mesh(new THREE.PlaneGeometry(w, h), barMat);
        bar.position.set(x, y, 0);
        const glow = new THREE.Mesh(new THREE.PlaneGeometry(w + 0.06, h + 0.06), glowMat);
        glow.position.set(x, y, -0.001);
        frame.add(glow, bar);
      }
      frame.position.set(0, 0, -0.45);
      scene.add(frame);

      // Floor reflection hint.
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(4, 4),
        new THREE.MeshBasicMaterial({ color: look.accent, transparent: true, opacity: 0 })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -0.42;
      scene.add(floor);

      await document.fonts.load('700 40px "Syncopate"');
      const out = document.getElementById("out");
      const ctx = out.getContext("2d");
      const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
      const clamp = (v) => Math.min(1, Math.max(0, v));

      window.renderFrame = (t, duration) => {
        const p = t / duration;
        const lightIn = ease(clamp(p / 0.25));
        barMat.opacity = lightIn;
        glowMat.opacity = 0.18 * lightIn * (0.85 + 0.15 * Math.sin(t * 9));
        floor.material.opacity = 0.05 * lightIn;

        pivot.rotation.y = -Math.PI * 0.55 + ease(clamp(p / 0.92)) * Math.PI * 1.25;
        pivot.position.y = 0.01 * Math.sin(t * 1.4);
        const dolly = ease(clamp(p));
        camera.position.set(0.12 * Math.sin(p * Math.PI), 0.02, 2.35 - 0.35 * dolly);
        camera.lookAt(0, 0, 0);
        renderer.render(scene, camera);

        ctx.drawImage(renderer.domElement, 0, 0);
        const vignette = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.95);
        vignette.addColorStop(0, "rgba(0,0,0,0)");
        vignette.addColorStop(1, "rgba(0,0,0,0.75)");
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, W, H);

        const typeIn = ease(clamp((p - 0.68) / 0.22));
        if (typeIn > 0) {
          ctx.save();
          ctx.globalAlpha = typeIn;
          ctx.fillStyle = "#ffffff";
          ctx.textAlign = "center";
          ctx.font = '700 46px "Syncopate"';
          ctx.letterSpacing = `${18 - 6 * typeIn}px`;
          ctx.fillText("STRYDE", W / 2, H - 92 - 10 * (1 - typeIn));
          ctx.font = '700 13px "Syncopate"';
          ctx.letterSpacing = "6px";
          ctx.fillStyle = look.accentCss;
          ctx.fillText(look.line, W / 2, H - 58);
          ctx.restore();
        }
        return out.toDataURL("image/png");
      };
      window.ready = true;
    </script>
    <style>
      @font-face { font-family: "Syncopate"; src: url("/public/fonts/Syncopate-Bold.ttf"); font-weight: 700; }
    </style>
  </body>
</html>
